[package]
name = "centrex_core"
version = "0.1.0"
edition = "2021"
description = "Centrex Core platform runtime"
license = "MIT"

[[bin]]
name = "centrex-core"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
xz2 = "0.1"
flate2 = "1.0"
elb = "0.1"
roxmltree = "0.20"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"